<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva cita | Sistema Veterinaria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header class="page-header">
        <div>
            <p class="eyebrow">Agenda veterinaria</p>
            <h1>Programar cita</h1>
        </div>
        <a th:href="@{/appointments}" class="btn-back">Volver a citas</a>
    </header>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/appointments}" th:object="${appointmentRequest}" method="post" class="form">
        <div class="form-grid">
            <div class="form-group full-span">
                <label for="patientId">Paciente</label>
                <select id="patientId" th:field="*{patientId}" required>
                    <option value="">Seleccione un paciente</option>
                    <option th:each="patient : ${patients}" th:value="${patient.id}"
                            th:text="${patient.name + ' - ' + patient.owner}"></option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Fecha</label>
                <input id="date" type="date" th:field="*{date}" required>
            </div>
            <div class="form-group">
                <label for="time">Hora</label>
                <input id="time" type="time" th:field="*{time}" required>
            </div>
            <div class="form-group full-span">
                <label for="reason">Motivo</label>
                <input id="reason" type="text" th:field="*{reason}" placeholder="Control, vacunacion, consulta..." required>
            </div>
            <div class="form-group full-span">
                <label for="veterinarian">Veterinario</label>
                <input id="veterinarian" type="text" th:field="*{veterinarian}" placeholder="vet1" required>
            </div>
        </div>

        <div class="button-row">
            <button type="submit" class="btn-primary">Guardar cita</button>
            <a th:href="@{/appointments}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
