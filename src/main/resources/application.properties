spring.application.name=frontend

# El frontend corre en su propio puerto y consume el backend desde el servidor para respetar la arquitectura navegador -> frontend -> backend.
server.port=8082
backend.base-url=${BACKEND_URL:http://localhost:8089}

# La cookie JWT se deja HttpOnly y sin secure por defecto para permitir pruebas locales sobre HTTP sin tocar el backend.
app.security.jwt-cookie.name=FRONTEND_AUTH_TOKEN
app.security.jwt-cookie.secure=${JWT_COOKIE_SECURE:false}
app.security.jwt-cookie.max-age-seconds=${JWT_COOKIE_MAX_AGE_SECONDS:3600}
app.security.jwt-cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}

# El frontend valida el JWT con la misma firma actual del backend para proteger las vistas privadas sin depender de sesiones del navegador.
app.security.jwt-secret=${JWT_SECRET:ZnJhc2VzbGFyZ2FzcGFyYWNvbG9jYXJjb21vY2xhdmVlbnVucHJvamVjdG9kZWVtZXBsb3BhcmFqd3Rjb25zcHJpbmdzZWN1cml0eQ==bWlwcnVlYmFkZWVqbXBsb3BhcmFiYXNlNjQ=}

logging.level.com.duoc.frontend=INFO
