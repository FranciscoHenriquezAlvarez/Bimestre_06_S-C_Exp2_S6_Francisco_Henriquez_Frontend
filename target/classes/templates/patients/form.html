<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo paciente | Sistema Veterinaria</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <header class="page-header">
        <div>
            <p class="eyebrow">Atencion veterinaria</p>
            <h1>Registrar paciente</h1>
        </div>
        <a th:href="@{/patients}" class="btn-back">Volver a pacientes</a>
    </header>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <form th:action="@{/patients}" th:object="${patientRequest}" method="post" class="form">
        <div class="form-grid">
            <div class="form-group">
                <label for="name">Nombre mascota</label>
                <input id="name" type="text" th:field="*{name}" placeholder="Nombre de la mascota" required>
            </div>
            <div class="form-group">
                <label for="species">Especie</label>
                <input id="species" type="text" th:field="*{species}" placeholder="Perro, Gato..." required>
            </div>
            <div class="form-group">
                <label for="breed">Raza</label>
                <input id="breed" type="text" th:field="*{breed}" placeholder="Raza o mestiza" required>
            </div>
            <div class="form-group">
                <label for="age">Edad</label>
                <input id="age" type="number" min="0" th:field="*{age}" required>
            </div>
            <div class="form-group full-span">
                <label for="owner">Dueno</label>
                <input id="owner" type="text" th:field="*{owner}" placeholder="Nombre del dueno" required>
            </div>
        </div>

        <div class="button-row">
            <button type="submit" class="btn-primary">Guardar paciente</button>
            <a th:href="@{/patients}" class="btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
